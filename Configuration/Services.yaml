services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Webconsulting\Abilities\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Attribute/*'
      - '../Classes/Catalog/CatalogEntry.php'
      - '../Classes/Compatibility/*'
      - '../Classes/Category/AsAbilityCategory.php'
      - '../Classes/Domain/*'
      - '../Classes/Event/*'
      - '../Classes/Http/CorsPolicy.php'
      - '../Classes/Http/InvalidRestInputException.php'
      - '../Classes/Http/RestConfiguration.php'
      - '../Classes/Http/RestEndpoint.php'
      - '../Classes/Http/RestRoute.php'
      - '../Classes/Permission/BackendUserContext.php'
      - '../Classes/Policy/AbilityPolicy.php'
      - '../Classes/Policy/PolicyDecision.php'
      - '../Classes/Projection/Mcp/McpToolDescriptor.php'
      - '../Classes/Reaction/*'
      - '../Classes/Security/IssuedToken.php'
      - '../Classes/Security/Token.php'

  # The REST settings, read once per container boot from the extension configuration.
  Webconsulting\Abilities\Http\RestConfiguration:
    factory: ['Webconsulting\Abilities\Http\RestConfiguration', 'fromExtensionConfiguration']
    arguments: ['@TYPO3\CMS\Core\Configuration\ExtensionConfiguration']

  Webconsulting\Abilities\Registry\AbilitiesRegistry:
    public: true

  Webconsulting\Abilities\Category\CategoryRegistry:
    public: true

  Webconsulting\Abilities\Execution\AbilityExecutor:
    public: true

  Webconsulting\Abilities\Catalog\AbilityCatalog:
    public: true

  Webconsulting\Abilities\Projection\Mcp\McpProjection:
    public: true

  Webconsulting\Abilities\Skills\SkillAbilityContract:
    public: true

  Webconsulting\Abilities\Permission\BackendUserScopeResolver:
    public: true

  Webconsulting\Abilities\Security\TokenService:
    public: true

  Webconsulting\Abilities\Security\TokenStorageInterface:
    alias: Webconsulting\Abilities\Security\DatabaseTokenStorage

  # Instantiated by TYPO3, not injected: TCA itemsProcFunc, data processor, backend routes
  Webconsulting\Abilities\Backend\Tca\RegistryItemsProcFunc:
    public: true

  Webconsulting\Abilities\DataProcessing\AbilityProcessor:
    public: true

  Webconsulting\Abilities\Backend\Controller\AbilitiesModuleController:
    public: true

  Webconsulting\Abilities\Backend\Controller\AbilitiesAjaxController:
    public: true
