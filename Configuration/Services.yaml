services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Webconsulting\Abilities\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Attribute/*'
      - '../Classes/Category/AsAbilityCategory.php'
      - '../Classes/Domain/*'
      - '../Classes/Event/*'
      - '../Classes/Policy/AbilityPolicy.php'
      - '../Classes/Http/CorsPolicy.php'
      - '../Classes/Http/InvalidRestInputException.php'
      - '../Classes/Http/RestConfiguration.php'
      - '../Classes/Http/RestIdentity.php'
      - '../Classes/Http/RestRoute.php'
      - '../Classes/Policy/PolicyDecision.php'
      - '../Classes/Security/IssuedToken.php'
      - '../Classes/Security/Token.php'

  Webconsulting\Abilities\Registry\AbilitiesRegistry:
    public: true

  Webconsulting\Abilities\Category\CategoryRegistry:
    public: true

  Webconsulting\Abilities\Execution\AbilityExecutor:
    public: true

  Webconsulting\Abilities\Permission\BackendUserScopeResolver:
    public: true

  Webconsulting\Abilities\Permission\ScopeItemsProcFunc:
    public: true

  Webconsulting\Abilities\Security\TokenService:
    public: true

  Webconsulting\Abilities\Security\TokenStorageInterface:
    alias: Webconsulting\Abilities\Security\DatabaseTokenStorage

  # Backend module route targets
  Webconsulting\Abilities\Backend\Controller\AbilitiesModuleController:
    public: true

  Webconsulting\Abilities\Backend\Controller\AbilitiesAjaxController:
    public: true
